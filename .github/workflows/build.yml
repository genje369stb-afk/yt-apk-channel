name: Build APK Otomatis

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet & Build APK
        run: |
          pip install flet requests
          flet build apk --project "YT Manager Mobile"

      - name: Siapkan File APK untuk Didownload
        uses: actions/upload-artifact@v4
        with:
          name: YT_Manager_Mobile_APK
          path: build/apk/*.apk
